<div class="lab-workspace">
    <div #canvasContainer class="canvas-container"></div>

    <div class="controls-panel">
        <h3>Molecules</h3>
        
        @if (loading()) {
            <div class="loading">Loading molecules...</div>
        } @else {
            <div class="molecule-buttons">
                @for (mol of availableMolecules(); track mol.id) {
                    <button
                        (click)="addMoleculeToScene(mol)"
                        [title]="mol.name">
                        {{ mol.formula }}
                    </button>
                }
            </div>
        }

        <div class="scene-info">
            <span>Molecules in scene: {{ sceneMoleculeCount() }}</span>
        </div>

        <div class="actions">
            <button (click)="clearWorkspace()">Clear</button>
            <button (click)="resetCamera()">Reset Camera</button>
        </div>
    </div>

    @if (error()) {
        <div class="error-overlay">
            <span>{{ error() }}</span>
            <button (click)="retry()">Retry</button>
        </div>
    }
</div>
