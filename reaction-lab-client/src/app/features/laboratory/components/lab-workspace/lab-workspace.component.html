<div class="lab-layout">
    <aside class="left-panel" [class.collapsed]="isPanelCollapsed()">
        <app-periodic-table-panel (collapsed)="onPanelCollapsed($event)"></app-periodic-table-panel>
    </aside>

    <main class="main-area">
        <div
            #canvasContainer
            class="canvas-container"
            [appDropZone]="['molecule']"
            (itemDropped)="onMoleculeDrop($event)">
        </div>

        <div class="controls-panel">
            <div class="scene-info">
                <mat-icon>view_in_ar</mat-icon>
                {{ sceneMoleculeCount() }} molecules in scene
            </div>

            <div class="scene-controls">
                <button mat-stroked-button (click)="clearWorkspace()" matTooltip="Remove all molecules">
                    <mat-icon>delete_sweep</mat-icon>    
                    Clear
                </button>
                <button mat-stroked-button (click)="resetCamera()" matTooltip="Reset camera position">
                    <mat-icon>center_focus_strong</mat-icon>
                    Reset View
                </button>
            </div>
        </div>

        @if (error()) {
            <div class="error-overlay">
                <mat-icon>error_outline</mat-icon>
                <span>{{ error() }}</span>
                <button mat-flat-button color="warn" (click)="retry()">
                    <mat-icon>refresh</mat-icon>
                    Retry
                </button>
            </div>
        }
    </main>

    <aside class="right-panel" [class.collapsed]="isRightPanelCollapsed()">
        <app-molecules-panel
            (collapsed)="onRightPanelCollapsed($event)"
            (addMolecule)="addMoleculeToScene($event)">
        </app-molecules-panel>
    </aside>
</div>
