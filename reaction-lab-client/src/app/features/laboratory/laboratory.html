<ng-container *transloco="let t; prefix: 'lab'">
    <main
        rlDropTarget
        class="lab-viewport"
        (dropped)="onDropped($event)"
    >
        @if (workspace.isEmpty()) {
            <rl-empty-state
                [icon]="icons.flaskConical"
                [heading]="t('empty.heading')"
                [description]="t('empty.description')"
            >
                <button rlButton variant="primary" (click)="ui.openPalette()">{{ t('empty.search') }}</button>
            </rl-empty-state>

            <button rlButton variant="secondary" (click)="ui.openTable()">{{ t('empty.table') }}</button>
        } @else {
            <app-bench-scene></app-bench-scene>
            <app-bench></app-bench>
        }
    </main>

    <app-reactions-sheet></app-reactions-sheet>

    <app-periodic-table-sheet></app-periodic-table-sheet>

    <rl-drag-preview>
        @if (dragged(); as substance) {
            <rl-chem-formula
                [formula]="substance.formula"
                [state]="stateSymbol(substance.stateAtRoomTemperature)"
            ></rl-chem-formula>
        }
    </rl-drag-preview>

    <app-lab-palette
        [label]="t('palette.label')"
        [placeholder]="t('palette.placeholder')"
        [emptyText]="t('palette.empty')"
        [substancesLabel]="t('palette.substances')"
        [elementsLabel]="t('palette.elements')"
        [reactionsLabel]="t('palette.reactions')"
    >
        <span class="lab-palette-hint">
            <kbd rlKbd><rl-icon [icon]="icons.arrowUp" size="sm" [label]="t('palette.up')"></rl-icon></kbd>
            <kbd rlKbd><rl-icon [icon]="icons.arrowDown" size="sm" [label]="t('palette.down')"></rl-icon></kbd>
            {{ t('palette.navigate') }}
        </span>
        <span class="lab-palette-hint">
            <kbd rlKbd><rl-icon [icon]="icons.cornerDownLeft" size="sm" [label]="t('palette.enter')"></rl-icon></kbd>
            {{ t('palette.add') }}
        </span>
        <span class="lab-palette-hint"><kbd rlKbd>Esc</kbd>{{ t('palette.close') }}</span>
    </app-lab-palette>
</ng-container>
