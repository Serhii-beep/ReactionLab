<ng-container *transloco="let t; prefix: 'lab'">
    <main
        rlDropTarget
        class="lab-viewport"
        [attr.data-dragging]="drag.isDragging() || null"
        (dropped)="onDropped($event)"
    >
        <app-bench></app-bench>
    </main>

    <rl-dock-group
        storagePrefix="reactionlab.dock"
        [presentation]="presentation()"
        [railLabel]="t('rail')"
    >
        <ng-template rlDockPanel side="start" [label]="t('elements.label')" [icon]="icons.atom">
            <app-elements-panel></app-elements-panel>
        </ng-template>

        <ng-template rlDockPanel side="end" [label]="t('substances.label')" [icon]="icons.flaskConical">
            <app-substances-panel></app-substances-panel>
        </ng-template>

        <ng-template
            rlDockPanel
            side="bottom"
            [label]="t('reactions.label')"
            [icon]="icons.arrowRightLeft"
            [minSize]="8"
            [maxSize]="24"
            [defaultSize]="12"
        >
            <app-reactions-panel></app-reactions-panel>
        </ng-template>
    </rl-dock-group>

    <rl-drag-preview>
        @if (dragged(); as substance) {
            <rl-chem-formula
                [formula]="substance.formula"
                [state]="stateSymbol(substance.stateAtRoomTemperature)"
            ></rl-chem-formula>
        }
    </rl-drag-preview>

    <app-lab-palette
        [label]="t('palette.label')"
        [placeholder]="t('palette.placeholder')"
        [emptyText]="t('palette.empty')"
        [substancesLabel]="t('palette.substances')"
        [elementsLabel]="t('palette.elements')"
    >
        <span class="lab-palette-hint">
            <kbd rlKbd><rl-icon [icon]="icons.arrowUp" size="sm" [label]="t('palette.up')"></rl-icon></kbd>
            <kbd rlKbd><rl-icon [icon]="icons.arrowDown" size="sm" [label]="t('palette.down')"></rl-icon></kbd>
            {{ t('palette.navigate') }}
        </span>
        <span class="lab-palette-hint">
            <kbd rlKbd><rl-icon [icon]="icons.cornerDownLeft" size="sm" [label]="t('palette.enter')"></rl-icon></kbd>
            {{ t('palette.add') }}
        </span>
        <span class="lab-palette-hint"><kbd rlKbd>Esc</kbd>{{ t('palette.close') }}</span>
    </app-lab-palette>
</ng-container>
