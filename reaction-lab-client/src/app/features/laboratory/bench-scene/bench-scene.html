<ul class="bench-scene">
    @for (item of workspace.entries(); track item.substance.id) {
        <li>
            <button
                class="bench-object"
                [attr.aria-pressed]="selection.isSelected(item.substance.id)"
                (click)="selection.toggle(item.substance.id)"
            >
                <span class="bench-object-body">
                    <rl-chem-formula
                        class="bench-object-formula"
                        [formula]="item.substance.formula"
                        [state]="stateSymbol(item.substance.stateAtRoomTemperature)"
                    ></rl-chem-formula>

                    @if (item.count > 1) {
                        <span class="bench-object-count">&times;{{ item.count }}</span>
                    }
                </span>

                <span class="bench-object-name">{{ item.substance.name }}</span>
            </button>
        </li>
    }
</ul>
