<ng-container *transloco="let t; prefix: 'app'">
  @if (breakpoints.size() === 'compact') {
    <rl-empty-state
      class="app-compact"
      [icon]="icons.monitor"
      [heading]="t('compact.heading')"
      [description]="t('compact.description')"
    ></rl-empty-state>
  } @else {
    <rl-app-shell>
      <rl-command-bar [heading]="t('title')" [subheading]="t('experiment.untitled')">
        <button rlSearchCue rlCommandBarSearch (click)="ui.openPalette()">
          <rl-icon [icon]="icons.search" size="sm"></rl-icon>
          <span class="rl-search-cue-text">{{ t('search') }}</span>
          <span class="rl-search-cue-keys">
            <kbd rlKbd>
              @if (isApple) {
                <rl-icon [icon]="icons.command" size="sm" [label]="t('commandKey')"></rl-icon>
              } @else {
                Ctrl
              }
            </kbd>
            <kbd rlKbd>K</kbd>
          </span>
        </button>

        <button rlButton variant="ghost" size="sm" (click)="ui.toggleTable()">
          <rl-icon [icon]="icons.atom" size="sm"></rl-icon>
          <span>{{ t('periodicTable') }}</span>
        </button>

        <rl-theme-toggle
          [label]="t('theme.label')"
          [lightLabel]="t('theme.light')"
          [darkLabel]="t('theme.dark')"
          [systemLabel]="t('theme.system')"
        ></rl-theme-toggle>
      </rl-command-bar>

      <router-outlet />
    </rl-app-shell>
  }
</ng-container>

<rl-toast-host />
