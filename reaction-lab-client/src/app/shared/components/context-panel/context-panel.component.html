<aside
    class="context-panel"
    [class.open]="isOpen()"
    [class.left]="side() === 'left'"
    [class.right]="side() === 'right'"
    [style.width.px]="width()">
    <div class="panel-header">
        <h3>{{ title() }}</h3>
        <button mat-icon-button (click)="onClose()">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <div class="panel-content">
        <ng-content></ng-content>
    </div>
</aside>
