@for (part of parts(); track $index) {
    @if (part.kind === 'subscript') {
        <sub>{{ part.value }}</sub>
    } @else {
        <span>{{ part.value }}</span>
    }
}

@if (chargeText(); as charge) {
    <sup>{{ charge }}</sup>
}

@if (state(); as state) {
    <span class="rl-chem-state" [attr.data-state]="state">({{ state }})</span>
}
