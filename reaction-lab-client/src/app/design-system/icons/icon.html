<svg
    #root
    class="rl-icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    [attr.data-size]="size()"
    [attr.role]="label() ? 'img' : null"
    [attr.aria-label]="label() ?? null"
    [attr.aria-hidden]="label() ? null : 'true'"
></svg>
