<div class="rl-search-field">
    <input
        #field
        rlInput
        type="search"
        [attr.aria-label]="label()"
        [placeholder]="placeholder()"
        [disabled]="disabled()"
        [value]="value()"
        (input)="onInput($event)"
        (keydown.escape)="clear()"
    />

    @if (value()) {
        <button rlIconButton size="sm" label="Clear {{ label() }}" (click)="clear()">
            <rl-icon [icon]="icons.x" size="sm"></rl-icon>
        </button>
    }
</div>
