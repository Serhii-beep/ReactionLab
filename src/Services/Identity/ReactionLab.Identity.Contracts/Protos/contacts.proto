syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "ReactionLab.Identity.Contracts.Contacts.V1";

package reactionlab.identity.contacts.v1;

service Contacts {
    rpc GetContact (GetContactRequest) returns (Contact);
    rpc GetPasswordChange (GetPasswordChangeRequest) returns (PasswordChangeDetails);
}

message GetContactRequest {
    string account_id = 1;
}

message Contact {
    string account_id = 1;
    optional string email = 2;
    bool email_confirmed = 3;
    string display_name = 4;
    string locale = 5;
    string time_zone = 6;
}

message GetPasswordChangeRequest {
    string account_id = 1;
    string change_id = 2;
}

message PasswordChangeDetails {
    google.protobuf.Timestamp changed_at = 1;
    string browser = 2;
    string operating_system = 3;
}
