name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      
      - name: Restore
        run: dotnet restore
      
      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes
      
      - name: Build
        run: dotnet build --no-restore --configuration Release
  
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reaction-lab-client
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: reaction-lab-client/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install the WebAssembly workload
        run: dotnet workload install wasm-tools
      
      - name: Install
        run: npm ci
      
      - name: Lint
        run: npm run lint

      - name: Type-check the worker
        run: npm run typecheck:worker
      
      - name: Lint styles
        run: npm run lint:styles
      
      - name: Contrast
        run: npm run check:contrast
      
      - name: Desktop color tokens
        run: |
          npm run desktop-tokens
          git diff --exit-code -- ../reaction-lab-desktop/render/src/theme_colors.rs

      - name: Publish the chemistry engine
        run: npm run chemistry
      
      - name: Build
        run: npm run build

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: reaction-lab-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Install the pinned toolchain
        run: rustup toolchain install
      
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: reaction-lab-desktop
      
      - name: Verify formatting
        run: cargo fmt --check
      
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      
      - name: Build
        run: cargo build --locked
      
      - name: Build the renderer for WebAssembly
        if: runner.os == 'Linux'
        run: cargo build --package reaction-lab-render --target wasm32-unknown-unknown --locked
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      - name: Publish the native chemistry engine
        run: dotnet publish ../src/Chemistry/ReactionLab.Chemistry.Native -c Release --use-current-runtime
        
  desktop-dependencies:
    name: Desktop dependencies (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Check ${{ matrix.checks }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: reaction-lab-desktop/Cargo.toml
          command: check ${{ matrix.checks }}
          arguments: --all-features --locked